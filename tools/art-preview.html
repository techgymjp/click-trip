<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>イラスト確認</title>
<style>body{background:#222;color:#eee;font:12px sans-serif;margin:8px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}.g div{background:#111}.g svg{width:100%;display:block}</style></head>
<body><p>開発用: data/spots.json のイラストを一覧表示（?n=件数&from=開始位置&q=名前の一部）</p><div class="g" id="g"></div>
<script src="../js/art.js"></script>
<script>
const q = new URLSearchParams(location.search);
fetch('../data/spots.json').then(r => r.json()).then(spots => {
  if (q.get('q')) spots = spots.filter(s => s.name.includes(q.get('q')));
  const from = +(q.get('from') || 0), n = +(q.get('n') || 60);
  document.getElementById('g').innerHTML = spots.slice(from, from + n).map(s =>
    `<div>${Art.render(s)}<b>${s.name}</b> ${s.pref} [${(s.art && s.art.motifs || []).join(', ')}]</div>`).join('');
});
</script></body></html>
