name: iOS build check

# iOS 版が Xcode でビルドできるかを確認する（署名なし・シミュレーター向け）。
# App Store に出すビルドは、手元の Mac の Xcode で作る（docs/IOS_BUILD.md）
on:
  push:
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'data/spots.json'
      - 'ios/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27   # Xcode 27 が入った GitHub の Mac
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Xcode 27 の正式版（beta・RC 以外）を使う。App Store は 2027 年 4 月から iOS 27 SDK 以降でのビルドを求める。
      # beta の Xcode でビルドしたものは App Store に出せないので、正式版がなければここで止める
      - name: Select Xcode 27 (release)
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -viE 'beta|rc|release_candidate' | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::正式版の Xcode 27 がこの Mac にありません"; exit 1; fi
          # Xcode_27.0.app などは beta 版への別名のことがあるので、実体の名前とビルド番号（beta は末尾が小文字。例 27A5218g）でも確かめる
          REAL=$(cd "$XCODE" && pwd -P)
          echo "selected: $XCODE -> $REAL"
          if echo "$REAL" | grep -qiE 'beta|rc|release_candidate'; then echo "::error::正式版の Xcode 27 がこの Mac にありません（$REAL は beta）"; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          if xcodebuild -version | grep -qE 'Build version [0-9A-Z]+[a-z]$'; then echo "::error::選んだ Xcode は beta です（ビルド番号の末尾が小文字）"; exit 1; fi
          xcodebuild -showsdks | grep -i iphoneos

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Copy web assets into the iOS project
        run: |
          npm run build:app
          npx cap sync ios

      # bash は pipefail で動くので、xcodebuild が失敗すればこのステップも失敗する
      - name: Build for the simulator (no signing)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
